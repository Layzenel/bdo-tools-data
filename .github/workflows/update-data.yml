name: Update data

# Каждый день собирает справочник навыков классов из открытого API bdolytics, докачивает новые иконки
# и, если что-то изменилось, коммитит docs/ в main. GitHub Pages раздаёт папку docs/ сам после каждого коммита:
#   https://layzenel.github.io/bdo-tools-data/skills.json
#   https://layzenel.github.io/bdo-tools-data/assets/… (иконки, путь — из поля icon)
#
# GitHub отключает расписание в публичном репозитории после 60 дней без активности. Защита:
#   1) коммиты с данными в main — это и есть активность;
#   2) последним шагом workflow включает сам себя (gh workflow enable), что сбрасывает счётчик.

on:
  schedule:
    - cron: "17 5 * * *"   # каждый день, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # коммит данных
  actions: write    # gh workflow enable
  issues: write     # issue о новом классе

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build skill catalog
        id: catalog
        run: |
          chmod +x gradlew
          ./gradlew test run --args="docs/skills.json"

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "Данные не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update skill catalog and icons"
          git push

      # Навыки нового класса уже в справочнике под ключом class-<номер>; issue напоминает внести его в таблицу
      - name: Report new classes
        if: steps.catalog.outputs.unknown_classes != ''
        run: |
          title="Новый класс bdolytics: ${{ steps.catalog.outputs.unknown_classes }}"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "Внесите номера в \`SkillTreeClasses\` (сверить по навыку «<Класс>'s Legacy» в дереве). Пока навыки лежат в справочнике под ключом \`class-<номер>\`."
          fi

      - name: Keep schedule alive
        if: always()
        run: gh workflow enable update-data.yml
